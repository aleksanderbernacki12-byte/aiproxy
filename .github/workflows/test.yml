name: Test

# Shared verification for pushes, pull requests, and the exact release commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting (gofmt)
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test ./... -race -count=1

  control-plane:
    name: Control Plane
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: control-plane
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Ephemeral CI service only; never a deployment credential.
      TEST_DATABASE_URL: postgresql://aiproxy:ci-only-password@localhost:5432/aiproxy_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aiproxy
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: aiproxy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiproxy -d aiproxy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: control-plane/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: PostgreSQL integration tests
        run: npm run test:integration

      # Build generates Next.js route types required by the standalone check.
      - name: Production build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck
