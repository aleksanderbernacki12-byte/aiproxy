name: Release

# Only ever runs when a version tag (v0.1.0, v1.2.3, ...) is pushed —
# never on ordinary branch pushes or pull requests.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Determine binary name
        id: vars
        shell: bash
        run: |
          name="aiproxy-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            name="${name}.exe"
          fi
          echo "binary_name=${name}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -o "dist/${{ steps.vars.outputs.binary_name }}" ./cmd/aiproxy

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.vars.outputs.binary_name }}
          path: dist/${{ steps.vars.outputs.binary_name }}
          if-no-files-found: error

  package-linux:
    name: Package Linux ${{ matrix.arch }} (.deb/.rpm)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download linux/${{ matrix.arch }} binary
        uses: actions/download-artifact@v8
        with:
          name: aiproxy-linux-${{ matrix.arch }}
          path: dist

      - name: Make binary executable
        run: chmod +x dist/aiproxy-linux-${{ matrix.arch }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install nfpm
        # go install verifies the module against the checksum database
        # (GOSUMDB) like any other Go dependency — no need to trust a
        # third-party marketplace action just to fetch a packaging tool.
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Render nfpm config for this version/arch
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed \
            -e "s|__VERSION__|${version}|g" \
            -e "s|__ARCH__|${{ matrix.arch }}|g" \
            .github/nfpm/nfpm.yaml.tmpl > nfpm.yaml

      - name: Build .deb and .rpm
        run: |
          nfpm package --config nfpm.yaml --packager deb --target "aiproxy_${GITHUB_REF_NAME#v}_${{ matrix.arch }}.deb"
          nfpm package --config nfpm.yaml --packager rpm --target "aiproxy_${GITHUB_REF_NAME#v}_${{ matrix.arch }}.rpm"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: aiproxy-linux-${{ matrix.arch }}-packages
          path: |
            *.deb
            *.rpm
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, package-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts into release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          ls -la release

      - name: Compute checksums
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          name: aiproxy ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload checksums for the Homebrew tap job
        uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: release/SHA256SUMS

  publish-docker-image:
    name: Publish Docker image to GHCR
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU (for the linux/arm64 build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  update-homebrew-tap:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      # Job-level `if:` can't see secrets at all (only github/inputs/needs/vars
      # are available there), so the check happens here instead, in a step
      # whose own `if:` can reference this step's own output. A release must
      # never be blocked by the tap token being unset, only skip the update.
      - name: Check for Homebrew tap token
        id: check_token
        run: |
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP_TOKEN is not set — skipping the Homebrew tap update."
          fi
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Checkout aiproxy (for the formula template)
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/checkout@v7

      - name: Download checksums
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/download-artifact@v8
        with:
          name: SHA256SUMS

      - name: Checkout homebrew-aiproxy
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/checkout@v7
        with:
          repository: aleksanderbernacki12-byte/homebrew-aiproxy
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render formula from this release's checksums
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          version="${{ github.ref_name }}"
          darwin_arm64=$(grep ' aiproxy-darwin-arm64$' SHA256SUMS | awk '{print $1}')
          darwin_amd64=$(grep ' aiproxy-darwin-amd64$' SHA256SUMS | awk '{print $1}')
          linux_arm64=$(grep ' aiproxy-linux-arm64$' SHA256SUMS | awk '{print $1}')
          linux_amd64=$(grep ' aiproxy-linux-amd64$' SHA256SUMS | awk '{print $1}')

          sed \
            -e "s|__VERSION__|${version}|g" \
            -e "s|__DARWIN_ARM64_SHA256__|${darwin_arm64}|" \
            -e "s|__DARWIN_AMD64_SHA256__|${darwin_amd64}|" \
            -e "s|__LINUX_ARM64_SHA256__|${linux_arm64}|" \
            -e "s|__LINUX_AMD64_SHA256__|${linux_amd64}|" \
            .github/homebrew/aiproxy.rb.tmpl > tap/Formula/aiproxy.rb

      - name: Commit and push, if the formula actually changed
        if: steps.check_token.outputs.has_token == 'true'
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "formula already up to date, nothing to commit"
            exit 0
          fi
          git add Formula/aiproxy.rb
          git commit -m "aiproxy ${{ github.ref_name }}"
          git push

  update-scoop-bucket:
    name: Update Scoop bucket
    needs: release
    runs-on: ubuntu-latest
    steps:
      # Same reasoning as the Homebrew job above: job-level `if:` can't
      # see secrets, so the check happens in a step whose own `if:` can
      # reference its output — a release must never fail just because
      # the bucket token isn't configured yet, only skip the update.
      - name: Check for Scoop bucket token
        id: check_token
        run: |
          if [ -n "$SCOOP_BUCKET_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "SCOOP_BUCKET_TOKEN is not set — skipping the Scoop bucket update."
          fi
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      - name: Checkout aiproxy (for the manifest template)
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/checkout@v7

      - name: Download checksums
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/download-artifact@v8
        with:
          name: SHA256SUMS

      - name: Checkout scoop-aiproxy
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/checkout@v7
        with:
          repository: aleksanderbernacki12-byte/scoop-aiproxy
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: bucket-repo

      - name: Render manifest from this release's checksums
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          amd64=$(grep ' aiproxy-windows-amd64.exe$' SHA256SUMS | awk '{print $1}')
          arm64=$(grep ' aiproxy-windows-arm64.exe$' SHA256SUMS | awk '{print $1}')

          sed \
            -e "s|__VERSION__|${version}|g" \
            -e "s|__TAG__|${tag}|g" \
            -e "s|__WINDOWS_AMD64_SHA256__|${amd64}|" \
            -e "s|__WINDOWS_ARM64_SHA256__|${arm64}|" \
            .github/scoop/aiproxy.json.tmpl > bucket-repo/bucket/aiproxy.json

      - name: Commit and push, if the manifest actually changed
        if: steps.check_token.outputs.has_token == 'true'
        working-directory: bucket-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "manifest already up to date, nothing to commit"
            exit 0
          fi
          git add bucket/aiproxy.json
          git commit -m "aiproxy ${{ github.ref_name }}"
          git push
